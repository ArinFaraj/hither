[package]
name = "drop"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Send files, sync the clipboard and type on your own devices"

[[bin]]
name = "drop"
path = "src/main.rs"

[dependencies]
iroh = "1.3"
iroh-mdns-address-lookup = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "process", "sync", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
data-encoding = "2"
rand = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
