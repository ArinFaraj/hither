[package]
name = "drop"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
description = "Send files, sync the clipboard and type on your own devices"
readme = "README.md"
keywords = ["clipboard", "file-transfer", "localsend", "quick-share", "iroh"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "drop"
path = "src/main.rs"

[dependencies]
iroh = "1.3"
iroh-mdns-address-lookup = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "process", "sync", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
data-encoding = "2"
rand = "0.9"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
hyper = { version = "1", features = ["http1", "client", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
futures-util = { version = "0.3", default-features = false }
tokio-util = { version = "0.7", features = ["io"] }
sha2 = "0.11"
socket2 = { version = "0.6", features = ["all"] }
prost = "0.14"
mdns-sd = "0.17"
ring = "0.17"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSData", "NSDictionary", "NSArray"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSBitmapImageRep", "NSImageRep", "NSGraphics"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
